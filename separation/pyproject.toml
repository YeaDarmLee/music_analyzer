[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-analyzer-separation"
version = "0.1.0"
description = "Local separation environment and Demucs smoke verification"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "soundfile==0.13.1", "psutil==7.1.0", "filelock==3.32.3"]

[project.optional-dependencies]
demucs = ["demucs==4.0.1", "torch==2.5.1", "torchaudio==2.5.1"]
roformer = ["einops==0.8.2", "rotary-embedding-torch==0.9.1", "beartype==0.22.9", "librosa==0.11.0", "scipy==1.14.1", "PyYAML==6.0.3"]
test = ["pytest==8.4.2"]

[project.scripts]
music-analyzer = "music_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
music_analyzer = ["comparison.html", "vendor/msst/LICENSE", "vendor/msst/PROVENANCE.json"]
